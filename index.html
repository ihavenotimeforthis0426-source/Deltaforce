<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角洲行動 交易所即時看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; }
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { font-size: 20px; color: #4caf50; margin-bottom: 5px; }
    .status { font-size: 12px; color: #888; margin-top: 5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 15px; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 15px; border: 1px solid #333; }
    .card-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .category { font-size: 11px; background: #333; color: #aaa; padding: 2px 6px; border-radius: 4px; }
    .price-box { margin: 10px 0; font-size: 14px; }
    .price-num { font-size: 18px; font-weight: bold; color: #ff9800; }
    .prediction { font-size: 13px; color: #4caf50; margin-top: 4px; }
    .tag { display: inline-block; padding: 3px 8px; font-size: 12px; border-radius: 4px; font-weight: bold; margin-top: 8px; }
    .tag-up { background: #2e7d32; color: #fff; }
    .tag-down { background: #c62828; color: #fff; }
    .tag-stable { background: #1565c0; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <h1>三角洲行動 交易所即時看板</h1>
    <div class="status" id="status">正在載入市場資料...</div>
  </div>

  <div class="grid" id="market-list"></div>

  <script>
    async function loadData() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('market-list');

      try {
        // 加入時間戳記避免瀏覽器快取舊資料
        const response = await fetch('./data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('無法讀取 data.json');
        
        let data = await response.json();
        
        // 如果 JSON 是物件格式，嘗試轉成陣列
        if (!Array.isArray(data)) {
          if (data.items) data = data.items;
          else data = Object.values(data);
        }

        if (!data || data.length === 0) {
          statusEl.innerText = '目前無資料或 data.json 為空';
          return;
        }

        statusEl.innerText = '最後更新時間：' + new Date().toLocaleTimeString();
        listEl.innerHTML = '';

        data.forEach(item => {
          const name = item.name || item.item_name || '未知物資';
          const category = item.category || '通用';
          const price = item.price || item.current_price || 0;
          const predPrice = item.predicted_price || item.target_price || price;
          const trend = item.trend || 'stable';
          const rec = item.recommendation || '觀望';

          let trendClass = 'tag-stable';
          if (trend === 'up' || rec.includes('買') || rec.includes('持有')) trendClass = 'tag-up';
          if (trend === 'down' || rec.includes('賣')) trendClass = 'tag-down';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-title">
              <span>${name}</span>
              <span class="category">${category}</span>
            </div>
            <div class="price-box">
              目前價格：<span class="price-num">$${price.toLocaleString()}</span>
            </div>
            <div class="prediction">
              AI 預測價格：$${predPrice.toLocaleString()}
            </div>
            <div>
              <span class="tag ${trendClass}">${rec}</span>
            </div>
          `;
          listEl.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        statusEl.innerText = '讀取資料失敗，請確認 data.json 格式與路徑';
      }
    }

    loadData();
  </script>
</body>
</html>
