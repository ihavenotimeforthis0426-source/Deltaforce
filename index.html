<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角洲行動 交易所即時看板</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-gold: #eab308;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      color: var(--accent-green);
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border-left: 4px solid var(--text-sub);
    }

    .card.red { border-left-color: var(--accent-red); }
    .card.purple { border-left-color: var(--accent-purple); }
    .card.blue { border-left-color: var(--accent-blue); }
    .card.gold { border-left-color: var(--accent-gold); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .item-name {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .item-category {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-sub);
    }

    .price-group {
      margin-top: 8px;
    }

    .current-price {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .predicted-price {
      font-size: 0.9rem;
      margin-top: 4px;
      color: var(--text-sub);
    }

    .rate-up { color: var(--accent-red); }
    .rate-down { color: var(--accent-green); }

    .loading, .error {
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>三角洲行動 交易所即時看板</h1>
      <div id="status" class="status-text">載入中...</div>
    </header>

    <div id="market-grid" class="grid"></div>
  </div>

  <script>
    const DATA_SOURCES = [
      './data.json',
      'https://raw.githubusercontent.com/ihavenotimeforthis0426-source/Deltaforce/main/data.json',
      'https://raw.githubusercontent.com/ihavenotimeforthis0426-source/Deltaforce/master/data.json'
    ];

    async function loadMarketData() {
      const statusEl = document.getElementById('status');
      const gridEl = document.getElementById('market-grid');
      let loadedData = null;
      let lastError = '';

      for (const src of DATA_SOURCES) {
        try {
          const res = await fetch(`${src}?t=${new Date().getTime()}`);
          if (res.ok) {
            loadedData = await res.json();
            break;
          } else {
            lastError = `${src} (HTTP ${res.status})`;
          }
        } catch (e) {
          lastError = `${src} (${e.message})`;
        }
      }

      if (!loadedData) {
        statusEl.innerText = `讀取失敗：${lastError}`;
        return;
      }

      const items = Object.values(loadedData);

      if (items.length === 0) {
        statusEl.innerText = "data.json 內暫無資料";
        return;
      }

      statusEl.innerText = `最後更新時間：${new Date().toLocaleTimeString()} (共 ${items.length} 筆資料)`;
      gridEl.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = `card ${item.quality || 'gold'}`;

        const rateClass = (item.predictedRate || 0) >= 0 ? 'rate-up' : 'rate-down';
        const rateSymbol = (item.predictedRate || 0) >= 0 ? '▲' : '▼';
        const currentPrice = item.history && item.history.length > 0 ? item.history[item.history.length - 1] : (item.price || 0);

        card.innerHTML = `
          <div class="card-header">
            <span class="item-name">${item.name}</span>
            <span class="item-category">${item.category || '通用'}</span>
          </div>
          <div class="price-group">
            <div class="current-price">$ ${currentPrice.toLocaleString()} 哈夫幣</div>
            <div class="predicted-price">
              AI 預測價格: $ ${(item.predictedPrice || currentPrice).toLocaleString()} 
              <span class="${rateClass}">(${rateSymbol} ${Math.abs(item.predictedRate || 0)}%)</span>
            </div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    loadMarketData();
  </script>
</body>
</html>
