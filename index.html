<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲行動 Garena台服交易所看板 V6</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 15px; margin: 0; }
        h1 { color: #4caf50; font-size: 1.5rem; text-align: center; margin: 10px 0 5px; }
        .sub-title { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 10px; }
        .status { text-align: center; color: #4caf50; font-size: 0.85rem; margin-bottom: 15px; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-btn { background: #2a2a2a; color: #ccc; border: none; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: #4caf50; color: #fff; font-weight: bold; }
        .item-card { background: #1e1e1e; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #ffb74d; }
        .item-header { display: flex; justify-content: space-between; align-items: center; }
        .item-title { font-weight: bold; font-size: 1.1rem; }
        .item-price { color: #ffeb3b; font-size: 1.2rem; font-weight: bold; text-align: right; }
        .ai-tag { display: inline-block; background: #0288d1; color: #fff; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>📊 三角洲行動 Garena台服交易所看板 V6</h1>
    <div class="sub-title">(ED YL Josh)</div>
    <div class="status">🟢 已全自動同步 Delta Force Tools 最新價格與 AI 預測</div>

    <div class="categories" id="catGroup">
        <button class="cat-btn active" onclick="filterCat('ALL')">全部物品</button>
    </div>

    <div id="itemList">載入中...</div>

    <script>
        let allData = [];

        async function loadData() {
            try {
                const res = await fetch('./data.json?t=' + new Date().getTime());
                allData = await res.json();
                renderCategories();
                renderItems(allData);
            } catch (e) {
                document.getElementById('itemList').innerHTML = '<div style="text-align:center;color:#888;">數據載入失敗，請確認 data.json 格式</div>';
            }
        }

        function renderCategories() {
            const cats = ['ALL', ...new Set(allData.map(i => i.category || i.type || '未分類'))];
            const catGroup = document.getElementById('catGroup');
            catGroup.innerHTML = cats.map(c => `
                <button class="cat-btn ${c === 'ALL' ? 'active' : ''}" onclick="filterCat('${c}', this)">
                    ${c === 'ALL' ? '全部物品' : c}
                </button>
            `).join('');
        }

        function filterCat(cat, btn) {
            if(btn) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            if (cat === 'ALL') {
                renderItems(allData);
            } else {
                const filtered = allData.filter(i => (i.category || i.type || '未分類') === cat);
                renderItems(filtered);
            }
        }

        function renderItems(data) {
            const list = document.getElementById('itemList');
            if (!data || data.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#888;margin-top:20px;">查無對應物資數據</div>';
                return;
            }
            list.innerHTML = data.map(item => `
                <div class="item-card">
                    <div class="item-header">
                        <div>
                            <div class="item-title">${item.name}</div>
                            <div style="font-size:0.8rem;color:#888;">${item.category || item.type || '通用品'}</div>
                            <div class="ai-tag">🤖 AI預測: ${item.predict || item.trend || '+0.0%'}</div>
                        </div>
                        <div class="item-price">
                            ${Number(item.price || 0).toLocaleString()} 哈夫幣
                        </div>
                    </div>
                </div>
            `).join('');
        }

        loadData();
    </script>
</body>
</html>
