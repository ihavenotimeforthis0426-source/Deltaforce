<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角洲行動 交易所即時看板</title>
  <!-- 載入 Chart.js 繪製價格折線圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-gold: #eab308;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--accent-green);
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* 分類篩選按鈕區 */
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .filter-btn {
      background-color: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--accent-green);
      color: #000;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border-left: 4px solid var(--text-sub);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card.red { border-left-color: var(--accent-red); }
    .card.purple { border-left-color: var(--accent-purple); }
    .card.blue { border-left-color: var(--accent-blue); }
    .card.gold { border-left-color: var(--accent-gold); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .item-name {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .item-category {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-sub);
    }

    .price-group {
      margin-top: 4px;
    }

    .current-price {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .predicted-price {
      font-size: 0.85rem;
      margin-top: 4px;
      color: var(--text-sub);
    }

    .rate-up { color: var(--accent-red); }
    .rate-down { color: var(--accent-green); }

    .chart-container {
      margin-top: 12px;
      height: 70px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>三角洲行動 交易所即時看板</h1>
      <div id="status" class="status-text">載入中...</div>
    </header>

    <!-- 分類按鈕列 -->
    <div id="filter-container" class="filter-group">
      <button class="filter-btn active" onclick="filterItems('全部')">全部</button>
    </div>

    <!-- 物資清單卡片區 -->
    <div id="market-grid" class="grid"></div>
  </div>

  <script>
    let allMarketItems = {};
    let currentFilter = '全部';

    async function loadMarketData() {
      const statusEl = document.getElementById('status');
      
      try {
        const res = await fetch(`./data.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("找不到 data.json");

        allMarketItems = await res.json();
        const items = Object.values(allMarketItems);

        if (items.length === 0) {
          statusEl.innerText = "data.json 暫無物資資料";
          return;
        }

        statusEl.innerText = `最後更新時間：${new Date().toLocaleTimeString()} (共 ${items.length} 筆資料)`;
        
        setupCategories(items);
        renderGrid();

      } catch (e) {
        statusEl.innerText = `讀取失敗：${e.message}`;
      }
    }

    // 動態建置分類篩選按鈕
    function setupCategories(items) {
      const filterContainer = document.getElementById('filter-container');
      const categories = ['全部', ...new Set(items.map(i => i.category || '通用物資'))];

      filterContainer.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === currentFilter ? 'active' : ''}" onclick="filterItems('${cat}')">${cat}</button>
      `).join('');
    }

    function filterItems(category) {
      currentFilter = category;
      setupCategories(Object.values(allMarketItems));
      renderGrid();
    }

    // 渲染卡片與繪製折線圖
    function renderGrid() {
      const gridEl = document.getElementById('market-grid');
      gridEl.innerHTML = '';

      const items = Object.values(allMarketItems).filter(item => {
        return currentFilter === '全部' || (item.category || '通用物資') === currentFilter;
      });

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card ${item.quality || 'gold'}`;

        const rate = item.predictedRate || 0;
        const rateClass = rate >= 0 ? 'rate-up' : 'rate-down';
        const rateSymbol = rate >= 0 ? '▲' : '▼';
        
        const history = item.history && item.history.length > 0 ? item.history : [item.price || 0];
        const currentPrice = history[history.length - 1];
        const predictedPrice = item.predictedPrice || currentPrice;

        const chartId = `chart-${index}`;

        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="item-name">${item.name}</span>
              <span class="item-category">${item.category || '通用物資'}</span>
            </div>
            <div class="price-group">
              <div class="current-price">$ ${currentPrice.toLocaleString()} 哈夫幣</div>
              <div class="predicted-price">
                AI 預測價格: $ ${predictedPrice.toLocaleString()} 
                <span class="${rateClass}">(${rateSymbol} ${Math.abs(rate)}%)</span>
              </div>
            </div>
          </div>
          <div class="chart-container">
            <canvas id="${chartId}"></canvas>
          </div>
        `;

        gridEl.appendChild(card);

        // 繪製 Chart.js 價格歷史趨勢折線圖
        setTimeout(() => {
          const ctx = document.getElementById(chartId);
          if (ctx) {
            new Chart(ctx, {
              type: 'line',
              data: {
                labels: history.map((_, i) => i + 1),
                datasets: [{
                  data: history,
                  borderColor: rate >= 0 ? '#ef4444' : '#22c55e',
                  borderWidth: 2,
                  pointRadius: 0,
                  tension: 0.3,
                  fill: false
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: true } },
                scales: {
                  x: { display: false },
                  y: { display: false }
                }
              }
            });
          }
        }, 50);
      });
    }

    loadMarketData();
  </script>
</body>
</html>
